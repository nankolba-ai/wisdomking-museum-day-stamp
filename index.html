<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสะสมตราประทับ & แลกรับของรางวัล (Test Mode)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6;
        }
        .heart-rating i {
            cursor: pointer;
            transition: transform 0.1s ease, color 0.1s ease;
        }
        .heart-rating i:hover {
            transform: scale(1.2);
        }
        .stamp-card {
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4">

    <!-- Banner ประกาศโหมดทดสอบ -->
    <div class="max-w-md mx-auto mb-4 bg-amber-500 text-white text-center py-2 px-4 rounded-lg shadow font-medium text-sm">
        ⚠️ อยู่ในโหมดทดสอบระบบ (แสตมป์ครบ 6 ดวงอัตโนมัติ / บันทึกซ้ำได้)
    </div>

    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white p-6 text-center relative">
            <h1 class="text-2xl font-bold mb-1">กิจกรรมสะสมตราประทับ</h1>
            <p class="text-emerald-100 text-sm">เรียนรู้นวัตกรรมเกษตร รับของรางวัลพิเศษ</p>
        </div>

        <div class="p-5 space-y-6">

            <!-- ส่วนที่ 1: การรวบรวมแสตมป์ -->
            <div class="stamp-card p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <span>🌸</span> สะสมตราประทับของคุณ
                    </h2>
                    <button onclick="resetTestData()" class="text-xs bg-rose-100 text-rose-600 hover:bg-rose-200 px-2.5 py-1 rounded-full font-medium transition">
                        <i class="fa-solid fa-rotate-left mr-1"></i>รีเซ็ตการเทส
                    </button>
                </div>

                <div class="grid grid-cols-3 gap-3 my-2" id="stampGrid">
                    <!-- จะถูกสร้างด้วย JS -->
                </div>
            </div>

            <!-- ส่วนที่ 2: แบบสอบถามความพึงพอใจ -->
            <form id="surveyForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                
                <div class="border-b pb-2">
                    <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-list text-emerald-600"></i> แบบสอบถามความพึงพอใจ
                    </h2>
                    <p class="text-xs text-slate-500">กรอกข้อมูลเพื่อรับสิทธิ์แลกของรางวัล</p>
                </div>

                <!-- ข้อมูลทั่วไป -->
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ - นามสกุล <span class="text-red-500">*</span></label>
                        <input type="text" id="inputName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ที่อยู่ปัจจุบัน (จังหวัด / อำเภอ) <span class="text-red-500">*</span></label>
                        <input type="text" id="inputAddress" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">จำนวนครั้งที่มา <span class="text-red-500">*</span></label>
                            <select id="inputVisits" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                                <option value="">-- เลือก --</option>
                                <option value="1 ครั้ง (มาครั้งแรก)">1 ครั้ง (มาครั้งแรก)</option>
                                <option value="2-3 ครั้ง">2-3 ครั้ง</option>
                                <option value="4-5 ครั้ง">4-5 ครั้ง</option>
                                <option value="มากกว่า 5 ครั้ง">มากกว่า 5 ครั้ง</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">เหตุผลที่มา <span class="text-red-500">*</span></label>
                            <input type="text" id="inputReason" required placeholder="เช่น เที่ยวชม, งานสัมมนา" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ข้อเสนอแนะเพิ่มเติม</label>
                        <textarea id="inputSuggestions" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm" placeholder="ความรู้สึกหรือข้อเสนอแนะ..."></textarea>
                    </div>
                </div>

                <!-- ให้คะแนนความพึงพอใจ -->
                <div class="pt-3 border-t">
                    <label class="block text-sm font-bold text-slate-800 mb-2">ให้คะแนนความพึงพอใจ (1-5 หัวใจ)</label>
                    
                    <!-- ภาพรวม -->
                    <div class="bg-emerald-50 p-3 rounded-lg mb-3 border border-emerald-100 flex justify-between items-center">
                        <span class="text-sm font-semibold text-emerald-900">ภาพรวมการจัดงาน</span>
                        <div class="heart-rating flex gap-1 text-lg" id="rating-overall"></div>
                    </div>

                    <!-- รายโซน 1-9 -->
                    <div class="space-y-2 max-h-60 overflow-y-auto pr-1" id="zoneRatingsContainer">
                        <!-- ถูกสร้างด้วย JS -->
                    </div>
                </div>

                <!-- การเลือกของรางวัล -->
                <div class="pt-3 border-t">
                    <label class="block text-sm font-bold text-slate-800 mb-2">เลือกรับของรางวัล <span class="text-red-500">*</span></label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-emerald-500 transition has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
                            <input type="radio" name="reward_option" value="muandoo" required class="mb-2 text-emerald-600 focus:ring-emerald-500">
                            <span class="text-2xl mb-1">🌱</span>
                            <span class="text-sm font-bold text-slate-800">หมื่นดู้</span>
                        </label>
                        <label class="border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer hover:border-emerald-500 transition has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
                            <input type="radio" name="reward_option" value="mahadoo" required class="mb-2 text-emerald-600 focus:ring-emerald-500">
                            <span class="text-2xl mb-1">🌳</span>
                            <span class="text-sm font-bold text-slate-800">มหาดดู้</span>
                        </label>
                    </div>
                </div>

                <!-- ปุ่มส่งข้อมูล -->
                <button type="submit" id="submitBtn" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> ยืนยันการบันทึกและรับรางวัล
                </button>
            </form>
        </div>
    </div>

    <script>
        // URL สคริปต์ Google Apps Script ล่าสุดของคุณ
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyed4nq3eyO4esgHFFVb68lVWp255FrLUG_DWy2rYpkr1KLTnsahAvkgc0Jp3hHwUAdDA/exec";

        // สถานะคะแนน (เริ่มต้น 5 ทุกช่อง)
        let overallRating = 5;
        let zoneRatings = [5, 5, 5, 5, 5, 5, 5, 5, 5];

        window.onload = function() {
            renderStamps();
            initRatingUI();
        };

        // วาดแสตมป์ (โหมดเทส: ครบ 6 ดวงทันที)
        function renderStamps() {
            const container = document.getElementById('stampGrid');
            container.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                container.innerHTML += `
                    <div class="h-16 rounded-xl border-2 border-dashed border-emerald-400 bg-emerald-50 flex flex-col items-center justify-center relative overflow-hidden shadow-inner">
                        <span class="text-xl">🌸</span>
                        <span class="text-[10px] text-emerald-700 font-bold mt-0.5">จุดที่ ${i}</span>
                        <div class="absolute inset-0 bg-emerald-500/10 flex items-center justify-center">
                            <i class="fa-solid fa-check text-emerald-600 text-xs bg-white rounded-full p-0.5 shadow"></i>
                        </div>
                    </div>
                `;
            }
        }

        // สร้าง UI คะแนนแบบหัวใจ (โดยไม่ให้ล้างค่าใน Form)
        function initRatingUI() {
            // Render คะแนนภาพรวม
            renderHearts('rating-overall', overallRating, (val) => {
                overallRating = val;
                renderHearts('rating-overall', overallRating);
            });

            // Render คะแนนโซน 1-9
            const zoneContainer = document.getElementById('zoneRatingsContainer');
            zoneContainer.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const zoneDiv = document.createElement('div');
                zoneDiv.className = 'flex justify-between items-center py-1.5 px-2 bg-slate-50 rounded border border-slate-100 text-xs';
                zoneDiv.innerHTML = `
                    <span class="text-slate-700 font-medium">โซนที่ ${i + 1}</span>
                    <div class="heart-rating flex gap-1 text-sm" id="rating-zone-${i}"></div>
                `;
                zoneContainer.appendChild(zoneDiv);

                renderHearts(`rating-zone-${i}`, zoneRatings[i], (val) => {
                    zoneRatings[i] = val;
                    renderHearts(`rating-zone-${i}`, zoneRatings[i]);
                });
            }
        }

        // ฟังก์ชันวาดหัวใจตามคะแนน
        function renderHearts(containerId, currentVal, onClickCallback) {
            const el = document.getElementById(containerId);
            if (!el) return;
            el.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const heart = document.createElement('i');
                heart.className = i <= currentVal ? 'fa-solid fa-heart text-rose-500' : 'fa-regular fa-heart text-slate-300';
                if (onClickCallback) {
                    heart.onclick = () => onClickCallback(i);
                }
                el.appendChild(heart);
            }
        }

        // ฟังก์ชันกดส่งข้อมูลเข้า Google Sheets
        function handleFormSubmit(event) {
            event.preventDefault();

            const rewardChoice = document.querySelector('input[name="reward_option"]:checked')?.value;
            if (!rewardChoice) {
                Swal.fire('กรุณาเลือกรางวัล', 'กรุณาเลือกรักประทานหมื่นดู้ หรือ มหาดดู้', 'warning');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...';

            // จัดเตรียมข้อมูลส่งให้ Google Apps Script
            const payload = {
                name: document.getElementById('inputName').value,
                address: document.getElementById('inputAddress').value,
                visits: document.getElementById('inputVisits').value,
                reason: document.getElementById('inputReason').value,
                suggestions: document.getElementById('inputSuggestions').value,
                overall_rating: overallRating,
                ratings: zoneRatings,
                muandoo_qty: rewardChoice === 'muandoo' ? 1 : 0,
                mahadoo_qty: rewardChoice === 'mahadoo' ? 1 : 0
            };

            fetch(GOOGLE_SHEET_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกสำเร็จ!',
                    text: `บันทึกข้อมูลและแจกรางวัล (${rewardChoice === 'muandoo' ? 'หมื่นดู้' : 'มหาดดู้'}) เรียบร้อยแล้ว`,
                    confirmButtonText: 'ตกลง'
                }).then(() => {
                    // รีเซ็ตเฉพาะตัวเลือกล่าสุดเพื่อพร้อมเทสรอบถัดไป
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ยืนยันการบันทึกและรับรางวัล';
                });
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ยืนยันการบันทึกและรับรางวัล';
            });
        }

        // ปุ่มรีเซ็ตข้อมูลการเทส
        function resetTestData() {
            document.getElementById('surveyForm').reset();
            overallRating = 5;
            zoneRatings = [5, 5, 5, 5, 5, 5, 5, 5, 5];
            initRatingUI();
            Swal.fire({
                icon: 'info',
                title: 'รีเซ็ตข้อมูลเทสแล้ว',
                timer: 1000,
                showConfirmButton: false
            });
        }
    </script>
</body>
</html>
