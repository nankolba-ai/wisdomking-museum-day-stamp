<script>
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyed4nq3eyO4esgHFFVb68lVWp255FrLUG_DWy2rYpkr1KLTnsahAvkgc0Jp3hHwUAdDA/exec";

    const ZONES = [
        { name: "โซนที่ 1 ตามรอยพ่ออยู่อย่างพอเพียง", img: "https://i.postimg.cc/xjZGY7N9/IMG-8587.jpg" },
        { name: "โซนที่ 2 รถสมเด็จย่า", img: "https://i.postimg.cc/LsvfW0Fy/7-(4).jpg" },
        { name: "โซนที่ 3 วิถีเกษตรของพ่อ", img: "https://i.postimg.cc/V66MPBY8/1w-th-kes_tr-(41).jpg" },
        { name: "โซนที่ 4 น้ำคือชีวิต", img: "https://i.postimg.cc/g04R7BbT/FX7-1110-0.jpg" },
        { name: "โซนที่ 5 วิถีเกษตรลุ่มน้ำ", img: "https://i.postimg.cc/W1SpMRvF/IMG-8618.jpg" },
        { name: "โซนที่ 6 ตลาดเงินทวี", img: "https://i.postimg.cc/SKQVj9yZ/3-(6).jpg" },
        { name: "โซนที่ 7 นวัตกรรมเกษตรเศรษฐกิจพอเพียง", img: "https://i.postimg.cc/MGtRLrJ9/h-xngnw-tkr-rm-x5-ch-n-2-(24).jpg" },
        { name: "โซนที่ 8 ฐานต้นไม้แห่งการเรียนรู้", img: "https://i.postimg.cc/fb5XPgQF/E4073AAA-C596-4D62-8DAE-C2883C8DD728.jpg" },
        { name: "โซนที่ 9 เกษตรคือชีวิต", img: "https://i.postimg.cc/XqrwdKhg/IMG-3620.jpg" }
    ];

    const todayStr = new Date().toISOString().split('T')[0];
    let lastPlayedDate = localStorage.getItem('last_played_date');

    if (lastPlayedDate !== todayStr) {
        localStorage.removeItem('stamps');
        localStorage.removeItem('ratings');
        localStorage.removeItem('overall_rating');
        localStorage.removeItem('user_info');
        localStorage.removeItem('redeemed_tier');
        localStorage.setItem('last_played_date', todayStr);
    }

    let stamps = JSON.parse(localStorage.getItem('stamps')) || Array(9).fill(false);
    let ratings = JSON.parse(localStorage.getItem('ratings')) || Array(9).fill(5);
    let overallRating = JSON.parse(localStorage.getItem('overall_rating')) || 5;
    let userInfo = JSON.parse(localStorage.getItem('user_info')) || { name: '', address: '', visits: '', reason: '', suggestions: '' };
    let redeemedTier = JSON.parse(localStorage.getItem('redeemed_tier')) || 0; 

    function triggerFireworks() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#f472b6', '#38bdf8', '#fbbf24', '#a7f3d0']
        });
    }

    // จัดการ URL parameter และล้างออกจาก Address Bar
    const urlParams = new URLSearchParams(window.location.search);
    const scannedZone = urlParams.get('scan');
    if (scannedZone && scannedZone >= 1 && scannedZone <= 9) {
        if (redeemedTier === 9) {
            alert('คุณได้รับของรางวัลมหาดดู้ (9 จุด) ประจำวันนี้เรียบร้อยแล้ว');
        } else {
            const index = scannedZone - 1;
            if (!stamps[index]) {
                stamps[index] = true;
                localStorage.setItem('stamps', JSON.stringify(stamps));
                setTimeout(() => triggerFireworks(), 500);
            }
        }
        // ลบ ?scan=... ออกจาก URL เพื่อไม่ให้สแกนซ้ำเมื่อรีเฟรชหน้า
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    function renderGrid() {
        const grid = document.getElementById('stamp-grid');
        grid.innerHTML = '';
        
        let collectedCount = stamps.filter(Boolean).length;

        ZONES.forEach((zone, index) => {
            const isCollected = stamps[index];
            grid.innerHTML += `
                <div class="stamp-sticker ${isCollected ? 'collected' : 'not-collected'} p-2 flex flex-col items-center justify-center text-center aspect-square">
                    <img src="${zone.img}" class="w-16 h-16 rounded-full object-cover mb-1 border-2 border-pink-200 shadow-sm">
                    <span class="text-[9px] leading-tight font-bold text-gray-600 line-clamp-2">${zone.name}</span>
                </div>
            `;
        });

        document.getElementById('stamp-count').innerText = collectedCount;
        
        const statusText = document.getElementById('reward-status-text');
        const redeemBtn = document.getElementById('redeem-btn');

        if (redeemedTier === 9) {
            statusText.innerText = "🔒 แลกครบทุกรางวัลแล้ว";
            statusText.className = "text-xs font-bold text-gray-400";
            redeemBtn.innerText = "🔒 รับของรางวัลครบแล้วประจำวันนี้";
            redeemBtn.className = "w-full bg-gray-400 text-white py-3.5 rounded-2xl text-lg font-bold shadow-lg cursor-not-allowed";
        } else if (collectedCount === 9) {
            if (redeemedTier === 6) {
                statusText.innerText = "📘 9 จุด: รับรางวัลมหาดดู้!";
                statusText.className = "text-xs font-bold text-pink-600 animate-pulse";
                redeemBtn.innerText = "🎁 รับของรางวัลมหาดดู้ (ครบ 9 จุด)";
            } else {
                statusText.innerText = "🎁 9 จุด: รับรางวัลหมื่นดู้ + มหาดดู้!";
                statusText.className = "text-[11px] font-bold text-pink-600 animate-pulse";
                redeemBtn.innerText = "🎁 รับของรางวัลหมื่นดู้ และ มหาดดู้";
            }
            redeemBtn.className = "w-full bg-gradient-to-r from-pink-500 via-rose-400 to-amber-400 text-white py-3.5 rounded-2xl text-lg font-bold shadow-lg hover:brightness-105 flex items-center justify-center gap-2 transition transform active:scale-98 animate-bounce";
        } else if (collectedCount >= 6) {
            if (redeemedTier === 6) {
                statusText.innerText = `🎨 รับรางวัลหมื่นดู้แล้ว (ขาดอีก ${9 - collectedCount} จุดแลกมหาดดู้)`;
                statusText.className = "text-[11px] font-bold text-sky-600";
                redeemBtn.innerText = `🎁 สะสมต่อ (${collectedCount}/9) เพื่อรับของรางวัลมหาดดู้`;
                redeemBtn.className = "w-full bg-gradient-to-r from-sky-400 to-indigo-400 text-white py-3.5 rounded-2xl text-lg font-bold shadow-lg hover:brightness-105 flex items-center justify-center gap-2 transition transform active:scale-98";
            } else {
                statusText.innerText = "🎨 6 จุด: รับของรางวัลหมื่นดู้ (ยังไม่ได้กดรับ)";
                statusText.className = "text-xs font-bold text-pink-600 animate-pulse";
                redeemBtn.innerText = "🎁 แสดง QR Code เพื่อรับของรางวัลหมื่นดู้";
                redeemBtn.className = "w-full bg-gradient-to-r from-sky-400 via-pink-400 to-amber-400 text-white py-3.5 rounded-2xl text-lg font-bold shadow-lg hover:brightness-105 flex items-center justify-center gap-2 transition transform active:scale-98 animate-bounce";
            }
        } else {
            statusText.innerText = `ขาดอีก ${6 - collectedCount} จุด แลกรางวัลหมื่นดู้`;
            statusText.className = "text-xs font-bold text-pink-500";
            redeemBtn.innerText = "🎁 สะสมให้ครบ 6 จุด เพื่อรับของรางวัลหมื่นดู้";
            redeemBtn.className = "w-full bg-gradient-to-r from-sky-400 via-pink-400 to-amber-400 text-white py-3.5 rounded-2xl text-lg font-bold shadow-lg hover:brightness-105 flex items-center justify-center gap-2 transition transform active:scale-98";
        }
    }

    // ดึงค่าจากช่อง Input เพื่อบันทึกลงในตัวแปร userInfo แบบ Real-time
    function syncInputsToUserInfo() {
        const name = document.getElementById('user-name').value.trim();
        const address = document.getElementById('user-address').value.trim();
        const visits = document.getElementById('user-visits').value;
        const reason = document.getElementById('user-reason').value.trim();
        const suggestions = document.getElementById('user-suggestions').value.trim();

        userInfo = { name, address, visits, reason, suggestions };
        localStorage.setItem('user_info', JSON.stringify(userInfo));
    }

    // ใส่ข้อมูลเดิมลงใน Form ช่องป้อนข้อมูล
    function populateFormInputs() {
        document.getElementById('user-name').value = userInfo.name || '';
        document.getElementById('user-address').value = userInfo.address || '';
        document.getElementById('user-visits').value = userInfo.visits || '';
        document.getElementById('user-reason').value = userInfo.reason || '';
        document.getElementById('user-suggestions').value = userInfo.suggestions || '';
    }

    function renderRatings() {
        const container = document.getElementById('rating-container');
        container.innerHTML = '';
        ZONES.forEach((zone, index) => {
            const currentVal = ratings[index];
            container.innerHTML += `
                <div class="flex items-center justify-between bg-pink-50/70 p-2 rounded-xl border border-pink-100">
                    <div class="flex items-center gap-2 w-7/12">
                        <img src="${zone.img}" class="w-10 h-10 rounded-lg object-cover border border-pink-200 shadow-sm flex-shrink-0">
                        <span class="font-medium text-[11px] text-gray-700 leading-tight line-clamp-2">${zone.name}</span>
                    </div>
                    <div class="flex items-center gap-0.5 cursor-pointer">
                        ${[1, 2, 3, 4, 5].map(star => `
                            <span class="text-base select-none" onclick="setZoneRating(${index}, ${star})">
                                ${star <= currentVal ? '❤️' : '🩶'}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `;
        });

        const overallContainer = document.getElementById('overall-rating-container');
        overallContainer.innerHTML = [1, 2, 3, 4, 5].map(star => `
            <span class="select-none transition transform active:scale-125" onclick="setOverallRating(${star})">
                ${star <= overallRating ? '❤️' : '🩶'}
            </span>
        `).join('');
    }

    function setZoneRating(zoneIndex, rating) {
        syncInputsToUserInfo(); // เซฟข้อมูลที่พิมพ์ค้างไว้ก่อนอัปเดตดาว
        ratings[zoneIndex] = rating;
        localStorage.setItem('ratings', JSON.stringify(ratings));
        renderRatings();
    }

    function setOverallRating(rating) {
        syncInputsToUserInfo(); // เซฟข้อมูลที่พิมพ์ค้างไว้ก่อนอัปเดตดาว
        overallRating = rating;
        localStorage.setItem('overall_rating', JSON.stringify(overallRating));
        renderRatings();
    }

    function toggleModal(id) {
        const modal = document.getElementById(id);
        modal.classList.toggle('hidden');
    }

    function handleRedeemClick() {
        if (redeemedTier === 9) {
            alert('คุณรับของรางวัลครบทุกระดับประจำวันนี้เรียบร้อยแล้ว');
            return;
        }

        const collectedCount = stamps.filter(Boolean).length;
        if (collectedCount < 6) {
            alert(`คุณต้องสะสม Stamp ให้ครบอย่างน้อย 6 จุดเพื่อรับของรางวัลหมื่นดู้ (ปัจจุบันมี ${collectedCount} จุด)`);
            return;
        }

        if (collectedCount >= 6 && collectedCount < 9 && redeemedTier === 6) {
            alert(`คุณเคยรับของรางวัลหมื่นดู้ (6 จุด) ไปแล้ว กรุณาสะสมต่อให้ครบ 9 จุดเพื่อรับของรางวัลมหาดดู้`);
            return;
        }

        populateFormInputs();
        renderRatings();
        toggleModal('info-modal');
    }

    async function saveUserInfoAndShowReward() {
        syncInputsToUserInfo(); // ดึงข้อมูลปัจจุบันเพื่อตรวจสอบ

        if (!userInfo.name || !userInfo.address || !userInfo.visits || !userInfo.reason) {
            alert('กรุณากรอกข้อมูลที่มีเครื่องหมาย (*) ให้ครบถ้วน');
            return;
        }

        toggleModal('info-modal');
        
        const collectedCount = stamps.filter(Boolean).length;
        const rewardTitle = document.getElementById('reward-title');
        const rewardDesc = document.getElementById('reward-desc');
        const qrImg = document.getElementById('qr-image');
        const confirmBtnText = document.getElementById('confirm-btn-text');

        if (collectedCount === 9) {
            rewardTitle.innerText = "🎉 ยินดีด้วย! สะสมครบ 9 จุด";
            if (redeemedTier === 6) {
                rewardDesc.innerHTML = "🎁 <b>สิทธิ์รับของรางวัล:</b><br>• ของรางวัลมหาดดู้ 📘";
                qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=REDEEM_MAHADOO_9_STAMPS";
                confirmBtnText.innerText = "ยืนยันการรับของรางวัลมหาดดู้ (เจ้าหน้าที่กด)";
            } else {
                rewardDesc.innerHTML = "🎁 <b>สิทธิ์รับของรางวัล (2 รายการ):</b><br>1. ของรางวัลหมื่นดู้ 🎨<br>2. ของรางวัลมหาดดู้ 📘";
                qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=REDEEM_DOUBLE_MUANDOO_AND_MAHADOO";
                confirmBtnText.innerText = "ยืนยันการรับของรางวัลทั้ง 2 ชิ้น (เจ้าหน้าที่กด)";
            }
        } else {
            rewardTitle.innerText = "🎉 ยินดีด้วย! สะสมครบ 6 จุด";
            rewardDesc.innerHTML = "🎁 <b>สิทธิ์รับของรางวัล:</b><br>• ของรางวัลหมื่นดู้ 🎨<br><span class='text-[10px] text-gray-500'>(สะสมต่อจนครบ 9 จุดเพื่อรับของรางวัลมหาดดู้ได้)</span>";
            qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=REDEEM_MUANDOO_6_STAMPS";
            confirmBtnText.innerText = "ยืนยันการรับของรางวัลหมื่นดู้ (เจ้าหน้าที่กด)";
        }

        toggleModal('reward-modal');
        triggerFireworks();
    }

    async function confirmRedeem() {
        const collectedCount = stamps.filter(Boolean).length;
        if (confirm('ยืนยันการรับของรางวัลเรียบร้อยแล้วใช่หรือไม่?')) {
            
            let redeemType = "";
            let muandooQty = 0;
            let mahadooQty = 0;

            if (collectedCount === 9) {
                if (redeemedTier === 6) {
                    redeemType = "9_STAMPS_SINGLE_MAHADOO";
                    mahadooQty = 1;
                    redeemedTier = 9;
                } else {
                    redeemType = "9_STAMPS_DOUBLE_REWARD";
                    muandooQty = 1;
                    mahadooQty = 1;
                    redeemedTier = 9;
                }
            } else if (collectedCount >= 6) {
                redeemType = "6_STAMPS_MUANDOO";
                muandooQty = 1;
                redeemedTier = 6;
            }

            // ส่งข้อมูลทั้งหมดเข้า Google Sheets เพื่อตัดสต๊อก
            const payload = {
                name: userInfo.name,
                address: userInfo.address,
                visits: userInfo.visits,
                reason: userInfo.reason,
                suggestions: userInfo.suggestions,
                ratings: ratings,
                overall_rating: overallRating,
                redeem_type: redeemType,
                muandoo_qty: muandooQty,
                mahadoo_qty: mahadooQty
            };

            try {
                await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error('Error sending data:', error);
            }

            localStorage.setItem('redeemed_tier', JSON.stringify(redeemedTier));
            toggleModal('reward-modal');
            renderGrid();
            alert('บันทึกการรับของรางวัลสำเร็จ!');
        }
    }

    function resetData() {
        if (redeemedTier >= 6) {
            alert('คุณเคยใช้สิทธิ์รับของรางวัลไปแล้ว ไม่สามารถรีเซ็ตข้อมูลเพื่อรับรางวัลหมื่นดู้ซ้ำได้ (แต่ยังคงสแกนสะสมต่อให้ครบ 9 จุดเพื่อรับของรางวัลมหาดดู้ได้)');
            return;
        }

        if (confirm('ต้องการรีเซ็ตข้อมูลการสะสมตราประทับทั้งหมดหรือไม่?')) {
            stamps = Array(9).fill(false);
            ratings = Array(9).fill(5);
            overallRating = 5;
            userInfo = { name: '', address: '', visits: '', reason: '', suggestions: '' };
            redeemedTier = 0;
            localStorage.removeItem('stamps');
            localStorage.removeItem('ratings');
            localStorage.removeItem('overall_rating');
            localStorage.removeItem('user_info');
            localStorage.removeItem('redeemed_tier');
            renderGrid();
        }
    }

    renderGrid();
</script>
