<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>พิพิธภัณฑ์การเกษตรเฉลิมพระเกียรติฯ - สะสม Stamp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ไลบรารีสำหรับแสดงเอฟเฟกต์พลุ (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #a8edd8 0%, #h8e5ff 100%);
            background-attachment: fixed;
        }
        /* ตกแต่งการ์ดแสตมป์ให้ออกแนว Stamp Sticker ขอบรอยปรุ */
        .stamp-sticker {
            background-color: #fff;
            border: 4px dashed #f472b6;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .stamp-sticker.collected {
            border-style: solid;
            border-color: #38bdf8;
            opacity: 1;
            filter: grayscale(0%);
            transform: scale(1.02);
        }
        .stamp-sticker.not-collected {
            filter: grayscale(100%);
            opacity: 0.5;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center p-0 sm:p-4">

    <div class="w-full max-w-md bg-pink-50/80 backdrop-blur-md shadow-2xl min-h-screen sm:min-h-0 sm:rounded-3xl flex flex-col overflow-hidden border-4 border-white">
        
        <!-- HEADER ZONE -->
        <div class="bg-gradient-to-r from-sky-400 via-pink-400 to-amber-300 text-white p-6 text-center rounded-b-3xl shadow-md relative">
            <div class="absolute inset-0 bg-white/10 backdrop-blur-[1px]"></div>
            <div class="relative z-10">
                <span class="bg-white/30 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-bold text-white shadow-sm">THAI MUSEUM DAY 2026</span>
                <h1 class="text-2xl font-bold mt-1 text-white drop-shadow">Wisdomking Museum Stamp Collection</h1>
                <p class="text-xs opacity-90 font-medium">พิพิธภัณฑ์การเกษตรเฉลิมพระเกียรติฯ</p>
            </div>
        </div>

        <!-- User Info & Progress Summary -->
        <div class="mx-4 -mt-4 z-20 bg-white/90 p-4 rounded-2xl shadow-lg border-2 border-pink-200 text-center">
            <div class="flex justify-around items-center mb-2">
                <div>
                    <p class="text-xs text-gray-500 font-semibold">Stamp สะสม</p>
                    <p class="text-2xl font-extrabold text-sky-500"><span id="stamp-count">0</span> / 9</p>
                </div>
                <div class="h-8 w-px bg-pink-200"></div>
                <div>
                    <p class="text-xs text-gray-500 font-semibold">ขาดอีก</p>
                    <p class="text-2xl font-extrabold text-pink-500"><span id="stamp-remaining">9</span> <span class="text-xs">จุด</span></p>
                </div>
            </div>
            
            <button onclick="toggleModal('info-modal')" class="mt-2 w-full bg-gradient-to-r from-amber-400 to-amber-500 text-white text-sm py-2.5 rounded-xl hover:opacity-90 font-bold shadow-md transition transform active:scale-95 flex items-center justify-center gap-1">
                📝 กรอกข้อมูลผู้เข้าร่วมกิจกรรม
            </button>
        </div>

        <!-- Stamp Grid Section -->
        <div class="p-4 flex-1">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-md font-bold text-gray-700 flex items-center gap-1">🌸 สะสมตราประทับของคุณ</h2>
                <button id="reset-btn" onclick="resetData()" class="text-xs text-pink-400 hover:text-pink-600 underline font-medium">รีเซ็ตข้อมูล</button>
            </div>

            <!-- Grid 9 Zones -->
            <div id="stamp-grid" class="grid grid-cols-3 gap-3"></div>
        </div>

        <!-- Redeem Button -->
        <div class="p-4">
            <button id="redeem-btn" onclick="checkRedemption()" class="w-full bg-gradient-to-r from-sky-400 via-pink-400 to-amber-400 text-white py-3.5 rounded-2xl text-lg font-bold shadow-lg hover:brightness-105 flex items-center justify-center gap-2 transition transform active:scale-98">
                🎁 แสดง QR Code เพื่อรับของรางวัล
            </button>
        </div>
    </div>

    <!-- Modal: User Info & Evaluation -->
    <div id="info-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto border-4 border-pink-200 shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-pink-600 text-center">📝 ข้อมูลผู้เข้าร่วมกิจกรรม</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">1. ชื่อ - นามสกุล *</label>
                    <input type="text" id="user-name" class="w-full border-2 border-pink-100 rounded-xl p-2.5 text-sm focus:border-pink-400 outline-none" placeholder="กรอกชื่อ-นามสกุล">
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">2. ที่อยู่ปัจจุบัน *</label>
                    <textarea id="user-address" rows="2" class="w-full border-2 border-pink-100 rounded-xl p-2.5 text-sm focus:border-pink-400 outline-none" placeholder="กรอกที่อยู่ปัจจุบัน"></textarea>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">3. มาเที่ยวพิพิธภัณฑ์การเกษตรฯ กี่ครั้งแล้ว *</label>
                    <select id="user-visits" class="w-full border-2 border-pink-100 rounded-xl p-2.5 text-sm focus:border-pink-400 outline-none bg-white">
                        <option value="">-- เลือกจำนวนครั้ง --</option>
                        <option value="1 ครั้ง (มาครั้งแรก)">1 ครั้ง (มาครั้งแรก)</option>
                        <option value="2-3 ครั้ง">2-3 ครั้ง</option>
                        <option value="4-5 ครั้ง">4-5 ครั้ง</option>
                        <option value="มากกว่า 5 ครั้ง">มากกว่า 5 ครั้ง</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">4. เหตุผลที่มาพิพิธภัณฑ์การเกษตรฯ *</label>
                    <input type="text" id="user-reason" class="w-full border-2 border-pink-100 rounded-xl p-2.5 text-sm focus:border-pink-400 outline-none" placeholder="เช่น ท่องเที่ยวพักผ่อน, พาลูกมาเรียนรู้">
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">5. ข้อเสนอแนะเพิ่มเติม</label>
                    <textarea id="user-suggestions" rows="2" class="w-full border-2 border-pink-100 rounded-xl p-2.5 text-sm focus:border-pink-400 outline-none" placeholder="ข้อเสนอแนะเพิ่มเติม (ถ้ามี)"></textarea>
                </div>

                <hr class="my-3 border-pink-100">
                <h4 class="font-bold text-xs text-gray-700">ประเมินความพึงพอใจแต่ละโซน</h4>
                <div id="rating-container" class="space-y-2 text-xs"></div>
            </div>

            <div class="flex gap-2 mt-5">
                <button onclick="toggleModal('info-modal')" class="w-1/3 bg-gray-200 text-gray-600 py-2.5 rounded-xl font-bold text-sm">ยกเลิก</button>
                <button id="save-btn" onclick="saveUserInfo()" class="w-2/3 bg-pink-500 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-pink-600 shadow-md">
                    บันทึกข้อมูล
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Reward Success -->
    <div id="reward-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center border-4 border-sky-200 shadow-2xl relative">
            <div class="text-6xl mb-2 animate-bounce">🎉</div>
            <h3 class="text-xl font-bold text-sky-600">สะสมครบ 9 จุดแล้ว!</h3>
            <p class="text-xs text-gray-500 mt-1">กรุณาแสดง QR Code นี้ให้เจ้าหน้าที่เพื่อรับของรางวัล</p>
            
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=REDEEMED_SUCCESS" class="mx-auto my-4 border-4 border-dashed border-sky-300 p-2 rounded-2xl bg-sky-50">
            
            <button onclick="confirmRedeem()" class="w-full bg-gradient-to-r from-pink-400 to-sky-400 text-white py-3 rounded-xl font-bold shadow-md hover:opacity-90">
                ยืนยันการรับของรางวัล (เจ้าหน้าที่กด)
            </button>
        </div>
    </div>

    <script>
        // อัปเดต URL เป็นรายการใช้งานจริง (/exec) ตัวล่าสุดเรียบร้อยแล้ว
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyXMBm4pqhePp4qIJNnQWueBZiElBLkw0D8LfWPpoikj0QdRSBFCPP62-ZATbXMU7SFWQ/exec";

        const ZONES = [
            { name: "โซนที่ 1 ตามรอยพ่ออยู่อย่างพอเพียง", img: "https://i.postimg.cc/xjZGY7N9/IMG-8587.jpg" },
            { name: "โซนที่ 2 รถสมเด็จย่า", img: "https://i.postimg.cc/LsvfW0Fy/7-(4).jpg" },
            { name: "โซนที่ 3 วิถีเกษตรของพ่อ", img: "https://i.postimg.cc/V66MPBY8/1w-th-kes_tr-(41).jpg" },
            { name: "โซนที่ 4 น้ำคือชีวิต", img: "https://i.postimg.cc/g04R7BbT/FX7-1110-0.jpg" },
            { name: "โซนที่ 5 วิถีเกษตรลุ่มน้ำ", img: "https://i.postimg.cc/W1SpMRvF/IMG-8618.jpg" },
            { name: "โซนที่ 6 ตลาดเงินทวี", img: "https://i.postimg.cc/SKQVj9yZ/3-(6).jpg" },
            { name: "โซนที่ 7 นวัตกรรมเกษตรเศรษฐกิจพอเพียง", img: "https://i.postimg.cc/MGtRLrJ9/h-xngnw-tkr-rm-x5-ch-n-2-(24).jpg" },
            { name: "โซนที่ 8 ฐานต้นไม้แห่งการเรียนรู้", img: "https://i.postimg.cc/fb5XPgQF/E4073AAA-C596-4D62-8DAE-C2883C8DD728.jpg" },
            { name: "โซนที่ 9 เกษตรคือชีวิต", img: "https://i.postimg.cc/XqrwdKhg/IMG-3620.jpg" }
        ];

        let stamps = JSON.parse(localStorage.getItem('stamps')) || Array(9).fill(false);
        let ratings = JSON.parse(localStorage.getItem('ratings')) || Array(9).fill(5);
        let userInfo = JSON.parse(localStorage.getItem('user_info')) || { name: '', address: '', visits: '', reason: '', suggestions: '' };
        let isRedeemed = JSON.parse(localStorage.getItem('is_redeemed')) || false;

        // ระบบเสียงเชียร์ "เฮ้!"
        function playCheerSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const bufferSize = ctx.sampleRate * 1.2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800;
                filter.Q.value = 3;

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                noise.start();
            } catch (e) {
                console.log("Audio deferred:", e);
            }
        }

        // เอฟเฟกต์พลุ
        function triggerFireworks() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#f472b6', '#38bdf8', '#fbbf24', '#a7f3d0']
            });
            playCheerSound();
        }

        // ตรวจสอบ URL params เมื่อสแกน QR Code
        const urlParams = new URLSearchParams(window.location.search);
        const scannedZone = urlParams.get('scan');
        if (scannedZone && scannedZone >= 1 && scannedZone <= 9) {
            if (isRedeemed) {
                alert('คุณได้ทำการรับของรางวัลไปเรียบร้อยแล้ว ไม่สามารถสแกนสะสมเพิ่มได้อีก');
            } else {
                const index = scannedZone - 1;
                if (!stamps[index]) {
                    stamps[index] = true;
                    localStorage.setItem('stamps', JSON.stringify(stamps));
                    setTimeout(() => {
                        triggerFireworks();
                    }, 500);
                }
            }
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        function renderGrid() {
            const grid = document.getElementById('stamp-grid');
            grid.innerHTML = '';
            
            let collectedCount = 0;
            ZONES.forEach((zone, index) => {
                const isCollected = stamps[index];
                if (isCollected) collectedCount++;

                grid.innerHTML += `
                    <div class="stamp-sticker ${isCollected ? 'collected' : 'not-collected'} p-2 flex flex-col items-center justify-center text-center aspect-square">
                        <img src="${zone.img}" class="w-12 h-12 rounded-full object-cover mb-1 border-2 border-pink-200 shadow-sm">
                        <span class="text-[9px] leading-tight font-bold text-gray-600 line-clamp-2">${zone.name}</span>
                        ${isCollected ? '<div class="absolute inset-0 bg-sky-400/20 rounded-xl flex items-center justify-center text-sky-600 font-extrabold text-3xl drop-shadow">🌸</div>' : ''}
                    </div>
                `;
            });

            document.getElementById('stamp-count').innerText = collectedCount;
            document.getElementById('stamp-remaining').innerText = 9 - collectedCount;

            if (isRedeemed) {
                const redeemBtn = document.getElementById('redeem-btn');
                redeemBtn.innerText = "🔒 รับของรางวัลไปแล้ว";
                redeemBtn.classList.remove('from-sky-400', 'via-pink-400', 'to-amber-400');
                redeemBtn.classList.add('bg-gray-400');
            }
        }

        function renderRatings() {
            const container = document.getElementById('rating-container');
            container.innerHTML = '';
            ZONES.forEach((zone, index) => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-pink-50 p-1.5 rounded-lg">
                        <span class="truncate w-1/2 font-medium text-gray-600">${zone.name}:</span>
                        <div class="text-amber-400 cursor-pointer">
                            ${[1, 2, 3, 4, 5].map(star => `
                                <span onclick="setRating(${index}, ${star})">${star <= ratings[index] ? '🌸' : '🤍'}</span>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            document.getElementById('user-name').value = userInfo.name || '';
            document.getElementById('user-address').value = userInfo.address || '';
            document.getElementById('user-visits').value = userInfo.visits || '';
            document.getElementById('user-reason').value = userInfo.reason || '';
            document.getElementById('user-suggestions').value = userInfo.suggestions || '';
        }

        function setRating(zoneIndex, rating) {
            ratings[zoneIndex] = rating;
            localStorage.setItem('ratings', JSON.stringify(ratings));
            renderRatings();
        }

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }

        function checkRedemption() {
            if (isRedeemed) {
                alert('คุณรับของรางวัลไปแล้ว ไม่สามารถรับของรางวัลซ้ำได้อีก');
                return;
            }

            const collectedCount = stamps.filter(Boolean).length;
            if (collectedCount === 9) {
                toggleModal('reward-modal');
                triggerFireworks();
            } else {
                alert(`คุณยังสะสม Stamp ไม่ครบ (ขาดอีก ${9 - collectedCount} จุด)`);
            }
        }

        function confirmRedeem() {
            if (confirm('ยืนยันว่าทำการรับของรางวัลเรียบร้อยแล้วใช่หรือไม่? (จะไม่สามารถรีเซ็ตหรือเล่นใหม่ได้อีก)')) {
                isRedeemed = true;
                localStorage.setItem('is_redeemed', JSON.stringify(true));
                toggleModal('reward-modal');
                renderGrid();
                alert('บันทึกการรับของรางวัลสำเร็จ!');
            }
        }

        async function saveUserInfo() {
            const name = document.getElementById('user-name').value.trim();
            const address = document.getElementById('user-address').value.trim();
            const visits = document.getElementById('user-visits').value;
            const reason = document.getElementById('user-reason').value.trim();
            const suggestions = document.getElementById('user-suggestions').value.trim();

            if (!name || !address || !visits || !reason) {
                alert('กรุณากรอกข้อมูลที่จำเป็น (*) ให้ครบถ้วน');
                return;
            }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.innerText = 'กำลังบันทึก...';

            userInfo = { name, address, visits, reason, suggestions };
            localStorage.setItem('user_info', JSON.stringify(userInfo));

            const payload = {
                name: name,
                address: address,
                visits: visits,
                reason: reason,
                suggestions: suggestions,
                ratings: ratings
            };

            try {
                await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert('บันทึกข้อมูลและแบบประเมินเรียบร้อยแล้ว!');
                toggleModal('info-modal');
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการส่งข้อมูลไปยัง Google Sheets');
                console.error('Error:', error);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'บันทึกข้อมูล';
            }
        }

        function resetData() {
            if (isRedeemed) {
                alert('คุณรับของรางวัลไปแล้ว ไม่สามารถรีเซ็ตข้อมูลได้อีก');
                return;
            }

            if (confirm('ต้องการรีเซ็ตข้อมูลการสะสมตราประทับทั้งหมดหรือไม่?')) {
                localStorage.clear();
                stamps = Array(9).fill(false);
                ratings = Array(9).fill(5);
                userInfo = { name: '', address: '', visits: '', reason: '', suggestions: '' };
                isRedeemed = false;
                renderGrid();
                renderRatings();
            }
        }

        // Init
        renderGrid();
        renderRatings();
    </script>
</body>
</html>
